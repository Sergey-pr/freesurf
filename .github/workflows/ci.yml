name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  go:
    # Both supported platforms: build tags differ per OS, and Linux does not build.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # The race detector needs cgo; clang is present on the macOS runner but
            # a C toolchain is not guaranteed on the Windows one.
            test-flags: -race
          - os: windows-latest
            test-flags: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # main.go embeds frontend/dist, which is gitignored, so the Vue build has to
      # run before anything compiles the root package.
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      - run: go vet ./...
      - run: go test ${{ matrix.test-flags }} ./...

  npm-audit:
    runs-on: ubuntu-latest
    # Advisory until the Vite toolchain upgrade (M3-T1) clears the known dev-only
    # findings; flip to blocking after that.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
